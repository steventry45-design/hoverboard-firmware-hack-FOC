name: Build

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '9-2019-q4'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build PWM firmware
        run: pio run -e VARIANT_PWM -v

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          path: .pio/build/VARIANT_PWM/**
          name: ${{ github.event.repository.name }}_PWM_build_${{ github.run_number }}
          retention-days: 5
